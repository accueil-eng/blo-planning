<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sync Urgence – BLO Planning</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box;}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.12);padding:32px;max-width:480px;width:100%;}
  h1{font-size:22px;margin:0 0 8px;color:#1e293b;}
  p{color:#64748b;font-size:14px;margin:0 0 24px;}
  .info{background:#f1f5f9;border-radius:10px;padding:14px;margin-bottom:20px;font-size:13px;color:#374151;line-height:1.6;}
  .info b{color:#1e293b;}
  button{width:100%;padding:16px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;}
  #btn-push{background:#16a34a;color:#fff;margin-bottom:10px;}
  #btn-push:hover{background:#15803d;}
  #btn-push:disabled{background:#9ca3af;cursor:default;}
  #btn-back{background:#e2e8f0;color:#374151;font-size:14px;}
  #status{margin-top:16px;padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;display:none;}
  .ok{background:#dcfce7;color:#166534;}
  .err{background:#fee2e2;color:#991b1b;}
  .info-status{background:#dbeafe;color:#1e40af;}
  #log{margin-top:12px;font-size:12px;color:#94a3b8;font-family:monospace;line-height:1.4;}
</style>
</head>
<body>
<div class="card">
  <h1>📡 Sync d'urgence – BLO Planning</h1>
  <p>Cet outil envoie les données locales de cet ordinateur vers GitHub, pour que l'autre ordinateur les récupère automatiquement.</p>
  <div class="info" id="info-box">⏳ Lecture des données locales…</div>
  <button id="btn-push" disabled>⬆️ Envoyer vers GitHub</button>
  <button id="btn-back" onclick="window.location='/'">← Retour au planning</button>
  <div id="status"></div>
  <div id="log"></div>
</div>
<script>
var SK="blo_planning_v1";
var GH_REPO="accueil-eng/blo-planning";
var GH_FILE="data.json";
var _x="dkxTQ1UxSlpIdHBhYWlwNHNSdTB4UmZoQ2doUDl6cU8xVWR6X3BoZw==";
var GH_TOKEN=(function(){try{return atob(_x).split("").reverse().join("");}catch(e){return "";}})();

var infoBox=document.getElementById("info-box");
var btnPush=document.getElementById("btn-push");
var statusEl=document.getElementById("status");
var logEl=document.getElementById("log");

function log(msg){logEl.innerHTML+=msg+"<br>";}
function showStatus(msg,cls){statusEl.className=cls;statusEl.textContent=msg;statusEl.style.display="block";}

var raw=localStorage.getItem(SK);
var D=null;
if(raw){
  try{
    D=JSON.parse(raw);
    var cells=Object.keys(D.cells||{}).length;
    var savedAt=D._savedAt||"date inconnue";
    var sals=Object.keys(D.salaries||{}).length;
    infoBox.innerHTML="<b>✅ Données trouvées</b><br>"+
      "• Sauvegardé le : <b>"+savedAt+"</b><br>"+
      "• Cellules planning : <b>"+cells+"</b><br>"+
      "• Salariés : <b>"+sals+"</b>";
    btnPush.disabled=false;
    btnPush.textContent="⬆️ Envoyer ces données vers GitHub";
  }catch(e){
    infoBox.innerHTML="<b>❌ Erreur lecture données</b> : "+e;
  }
} else {
  infoBox.innerHTML="<b>⚠️ Aucune donnée locale trouvée</b><br>Cet ordinateur n'a pas de données BLO Planning sauvegardées.";
}

btnPush.onclick=function(){
  btnPush.disabled=true;
  btnPush.textContent="⏳ Envoi en cours…";
  logEl.innerHTML="";
  showStatus("⏳ Connexion à GitHub…","info-status");

  D._savedAt=new Date().toISOString().replace("T"," ").substring(0,19);
  var json=JSON.stringify(D,null,2);
  var content=btoa(unescape(encodeURIComponent(json)));

  log("1. Récupération SHA actuel…");
  fetch("https://api.github.com/repos/"+GH_REPO+"/contents/"+GH_FILE,{
    headers:{"Authorization":"token "+GH_TOKEN,"Accept":"application/vnd.github.v3+json"}
  })
  .then(function(r){
    log("   → HTTP "+r.status);
    if(!r.ok)throw new Error("Lecture GitHub: HTTP "+r.status);
    return r.json();
  })
  .then(function(info){
    var sha=info.sha;
    log("2. SHA: "+sha.substring(0,12)+"…");
    log("3. Envoi ("+Math.round(json.length/1024)+" Ko)…");
    showStatus("⏳ Envoi des données…","info-status");
    return fetch("https://api.github.com/repos/"+GH_REPO+"/contents/"+GH_FILE,{
      method:"PUT",
      headers:{
        "Authorization":"token "+GH_TOKEN,
        "Accept":"application/vnd.github.v3+json",
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:"Sync urgence ordi Alexis "+new Date().toLocaleString("fr-FR"),
        content:content,
        sha:sha
      })
    });
  })
  .then(function(r){
    log("   → HTTP "+r.status);
    if(!r.ok)return r.json().then(function(e){throw new Error(e.message||("HTTP "+r.status));});
    return r.json();
  })
  .then(function(res){
    if(res.content){
      log("4. ✅ Succès !");
      showStatus("✅ Données envoyées ! L'autre ordinateur va se synchroniser automatiquement dans 2 minutes.","ok");
      btnPush.textContent="✅ Envoyé !";
    } else {
      throw new Error(JSON.stringify(res).substring(0,200));
    }
  })
  .catch(function(e){
    log("❌ Erreur : "+e);
    showStatus("❌ Erreur : "+e,"err");
    btnPush.disabled=false;
    btnPush.textContent="⬆️ Réessayer";
  });
};
</script>
</body>
</html>
